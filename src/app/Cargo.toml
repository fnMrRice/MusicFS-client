[package]
name = "musicfs-desktop"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
default-run = "musicfs-desktop"

[[bin]]
name = "musicfs-desktop"
path = "main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
sys-locale = "0.3"
url = "2"
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
musicfs-player-core = { path = "../player-core" }
musicfs-server-adapter = { path = "../server-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.58.0", features = [
    "Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT",
    "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage",
] }
windows-sys = { version = "0.60", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSValue"] }
objc2-media-player = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
tray-icon = { version = "=0.21.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
ksni = "=0.3.7"
mpris-server = "=0.9.0"
tokio = { version = "1", features = ["macros"] }
