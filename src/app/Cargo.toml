[package]
name = "musicfs-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "musicfs-desktop"

[[bin]]
name = "musicfs-desktop"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
musicfs-player-core = { path = "../player-core" }
musicfs-server-adapter = { path = "../server-adapter" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
