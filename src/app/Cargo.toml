[package]
name = "musicfs-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "musicfs-desktop"

[[bin]]
name = "musicfs-desktop"
path = "main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
sys-locale = "0.3"
url = "2"
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
musicfs-player-core = { path = "../player-core" }
musicfs-server-adapter = { path = "../server-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
